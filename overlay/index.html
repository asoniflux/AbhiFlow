<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      -webkit-app-region: no-drag;
      user-select: none;
    }
    .overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 280px;
      height: 64px;
      margin: 8px auto;
      background: rgba(30, 30, 30, 0.92);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      padding: 0 20px;
    }

    .mic-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .mic-icon.recording {
      background: #ef4444;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .mic-icon.processing {
      background: #f59e0b;
      animation: spin 1s linear infinite;
    }
    .mic-icon.done {
      background: #22c55e;
    }

    .mic-icon svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    .waveform {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 32px;
      flex: 1;
    }
    .waveform .bar {
      width: 3px;
      background: #4f6ef7;
      border-radius: 2px;
      transition: height 0.1s ease;
      min-height: 4px;
    }

    .status-text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="mic-icon recording" id="micIcon">
      <svg viewBox="0 0 24 24" id="micSvg">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
    <div class="waveform" id="waveform"></div>
    <span class="status-text" id="statusText">Listening...</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const micIcon = document.getElementById('micIcon');
    const waveform = document.getElementById('waveform');
    const statusText = document.getElementById('statusText');
    const micSvg = document.getElementById('micSvg');

    // Create waveform bars
    const BAR_COUNT = 24;
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = '4px';
      waveform.appendChild(bar);
    }
    const bars = waveform.querySelectorAll('.bar');

    const PROCESSING_SVG = `<circle cx="12" cy="12" r="3" fill="white"/>`;
    const MIC_SVG = `<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>`;
    const CHECK_SVG = `<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="white"/>`;

    ipcRenderer.on('state-update', (_, { state, audioLevel }) => {
      micIcon.className = 'mic-icon ' + state;

      if (state === 'recording') {
        micSvg.innerHTML = MIC_SVG;
        statusText.textContent = 'Listening...';
        // Update waveform based on audio level
        bars.forEach((bar, i) => {
          const variance = Math.random() * 0.5 + 0.5;
          const height = Math.max(4, audioLevel * 28 * variance * Math.sin((i / BAR_COUNT) * Math.PI));
          bar.style.height = height + 'px';
          bar.style.background = '#4f6ef7';
        });
      } else if (state === 'processing') {
        micSvg.innerHTML = PROCESSING_SVG;
        statusText.textContent = 'Processing...';
        bars.forEach((bar) => {
          bar.style.height = '4px';
          bar.style.background = '#f59e0b';
        });
      } else if (state === 'done') {
        micSvg.innerHTML = CHECK_SVG;
        statusText.textContent = 'Done!';
        bars.forEach((bar) => {
          bar.style.height = '4px';
          bar.style.background = '#22c55e';
        });
      }
    });
  </script>
</body>
</html>
