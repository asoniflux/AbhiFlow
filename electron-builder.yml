appId: com.abhisheksoni.abhiflow
productName: AbhiFlow
copyright: Copyright © 2026 Abhishek Soni

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: assets/icon.icns
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Skip code signing for local builds (no Apple Developer account needed)
  identity: null

dmg:
  title: AbhiFlow
  icon: assets/icon.icns
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

directories:
  buildResources: assets
  output: dist

# Native .node binaries MUST be outside the asar archive to load
asarUnpack:
  - "**/*.node"
  - "node_modules/uiohook-napi/**"
  - "node_modules/better-sqlite3/**"
  - "node_modules/@jitsi/robotjs/**"

files:
  - main/**/*
  - renderer/dist/**/*
  - overlay/**/*
  - prompts/**/*
  - db/**/*
  - assets/**/*
  - node_modules/**/*

# Bundle the Fn key Swift helper alongside the app
extraResources:
  - from: helpers/fn-monitor
    to: fn-monitor
