appId: com.abhisheksoni.abhiflow
productName: AbhiFlow
copyright: Copyright © 2026 Abhishek Soni

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: assets/icon.icns
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Skip code signing for local builds (no Apple Developer account needed)
  identity: null

dmg:
  title: AbhiFlow
  icon: assets/icon.icns
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
    - x: 400
      y: 180
      type: link
      path: /Applications

directories:
  buildResources: assets
  output: dist

files:
  - main/**/*
  - renderer/dist/**/*
  - overlay/**/*
  - prompts/**/*
  - db/**/*
  - helpers/fn-monitor
  - assets/**/*
  - node_modules/**/*

# Include .env if it exists (for bundled API key)
extraFiles:
  - from: .env
    to: .env
    filter:
      - .env
